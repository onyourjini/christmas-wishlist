<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Wishlist</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">    
</head>
<body>
    <main>
        <h1>Christmas Wishlist</h1>
        <div class="add-row">
            <input type="text" id="wish-input" placeholder="Gift You want..." autocomplete="off" aria-label="Gift You wnat...">
            <button id="add-btn">Add</button>
        </div>
        <ul id="wish-list"></ul>
        <p id="empty-msg">It's empty! Write the gift you want to get.</p>
    </main>
    <img class="corner-photo" src="santa-behind-christmas-tree.png" alt="santa">

    <script src="script.js"></script>
</body>
</html>
